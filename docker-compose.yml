services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asuna-postgres
    environment:
      POSTGRES_USER: asuna
      POSTGRES_PASSWORD: asuna
      POSTGRES_DB: asuna
    ports:
      - "127.0.0.1:5432:5432" # 本地开发直连；仅绑定回环地址
    volumes:
      - asuna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asuna -d asuna"]
      interval: 5s
      timeout: 3s
      retries: 10

  console:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://asuna:asuna@postgres:5432/asuna
      CONSOLE_PORT: "8020"
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  asuna_pgdata:

