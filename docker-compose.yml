services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asuna-postgres
    environment:
      POSTGRES_USER: asuna
      POSTGRES_PASSWORD: asuna
      POSTGRES_DB: asuna
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432" # 本地开发直连；仅绑定回环地址
    volumes:
      - asuna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asuna -d asuna"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: asuna-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379" # 本地开发直连；仅绑定回环地址
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  console:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://asuna:asuna@postgres:5432/asuna
      REDIS_URL: redis://redis:6379/0
      CONSOLE_PORT: "8020"
    ports:
       - "127.0.0.1:8020:8020"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  asuna_pgdata:

