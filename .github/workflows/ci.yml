name: ci
on:
  push:
  pull_request:
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          dart run build_runner build
          git diff --exit-code
          flutter test
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: apps/backend
        run: |
          pip install uv
          uv sync
          uv run pytest tests/v50 -q
