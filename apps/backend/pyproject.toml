[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.19.1",
  "aiosmtplib>=4.0.0",
  "cryptography>=50.0.1",
  "fastapi[standard]>=0.141.1",
  "langchain>=1.3.15",
  "langchain-openai>=1.5.1",
  "openai>=3.1.0",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.15.0",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.52",
  "uvicorn>=0.52.3",
  "sonyflake>=2.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pylint>=3.3",
    "httpx>=0.28.1",
    "fakeredis>=2.26.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=5.0.0",
]

[tool.coverage.run]
source = ["app"]
omit = [
  "app/main.py",
  "app/core/db/*",
  "app/models/*",
  "app/migrations/*",
  "app/character/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.pylint.main]
source-roots = ["."]
ignore-paths = ["migrations/"]
init-hook = "import sys, os; cwd = os.getcwd(); candidates = [os.path.join(cwd, 'apps', 'backend', '.venv', 'Lib', 'site-packages'), os.path.join(cwd, '.venv', 'Lib', 'site-packages')]; [sys.path.insert(0, p) for p in candidates if os.path.isdir(p)]"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto --dist loadgroup"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
timeout = 120
timeout_method = "thread"
markers = [
  "unit: 纯逻辑单测（无 DB / 无 HTTP / 无网络，FakeLLM 允许）",
  "api: FastAPI Router 层测试（httpx ASGITransport + FakeLLM + 内存 SQLite）",
  "integration: 涉及 DB / 迁移 / 多模块协作（需真实 PG 的测试无实例时自动 skip）",
  "e2e: 完整业务流程（HTTP 全链路）",
  "golden: prompt 快照回归（UPDATE_GOLDEN=1 重新生成）",
  "slow: 慢测试（本地 SSE server 线程 / 大量轮询），日常开发默认排除",
  "legacy: 历史版本套件（v2 / v8.5 / v22~v26），默认不收集，需 --run-legacy 启用",
  "app_based: 内部标记（用例所在模块加载了 app.main，需装 auth dependency override）",
]
