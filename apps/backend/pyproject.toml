[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.19.1",
  "fastapi[standard]>=0.141.1",
  "langchain>=1.3.15",
  "langchain-openai>=1.5.1",
  "openai>=3.1.0",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.15.0",
  "sqlalchemy>=2.0.52",
  "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pylint>=3.3",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
]

[tool.pylint.main]
source-roots = ["."]
init-hook = "import sys, os; cwd = os.getcwd(); candidates = [os.path.join(cwd, 'apps', 'backend', '.venv', 'Lib', 'site-packages'), os.path.join(cwd, '.venv', 'Lib', 'site-packages')]; [sys.path.insert(0, p) for p in candidates if os.path.isdir(p)]"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto --dist loadscope"
