name: mobile
description: 朝夕 App Flutter 客户端
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  hooks_riverpod: ^3.0.1
  flutter_hooks: ^0.21.0
  go_router: ^14.6.2
  dio: ^5.7.0
  freezed_annotation: 3.1.0
  json_annotation: ^4.9.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  fl_chart: ^0.69.2
  lucide_icons: ^0.257.0
  intl: ^0.20.3
  flutter_markdown: ^0.7.4+3
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2
  photo_manager: ^3.6.0
  photo_manager_image_provider: ^2.1.0

dependency_overrides:
  # sqlite3 3.7.0 起改用 native-assets hook，构建期需连 GitHub 拉预编译产物
  # （本机网络不可达，flutter test 直接超时）；钉回 3.6.0 维持既有测试管线。
  sqlite3: 3.6.0

hooks:
  user_defines:
    sqlite3:
      # 本机直连 github.com 不可达：release 产物经 ghfast.top 镜像拉取
      # （字节不变，hook 会做 sha256 校验）。网络恢复后可整段移除。
      url_pattern: "https://ghfast.top/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^4.0.0
  freezed: 4.0.0
  json_serializable: ^6.9.5
  drift_dev: ^2.20.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/car/
    - assets/data/
  fonts:
    - family: lucide
      fonts:
        - asset: fonts/lucide.ttf

