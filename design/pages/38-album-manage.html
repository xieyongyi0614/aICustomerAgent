<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>朝夕 · 38 相册批量管理 — 高保真原型</title>
<style>
/* ============ 基础与主题 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F4F0;            /* 暖纸白：长期陪伴的背景 */
  --card:#FFFFFF;
  --ink:#1B1C23;           /* 主文字 */
  --ink2:#6E7079;          /* 次文字 */
  --ink3:#A7A8B1;          /* 弱文字 */
  --line:#ECEAE3;
  --ai1:#7A5CFF;           /* AI 紫 */
  --ai2:#3E8BFF;           /* AI 蓝 */
  --ai3:#2BD2E8;           /* AI 青 */
  --warm:#FF9D76;          /* 温暖点缀 */
  --health:#33BC8C;
  --money:#EFA63C;
  --grad-ai:linear-gradient(135deg,#8B6DFF 0%,#4D8DFF 55%,#2BD2E8 100%);
  --shadow-card:0 10px 30px rgba(27,28,35,.06);
  --r-lg:24px;--r-md:18px;--r-sm:12px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonicOS Sans SC","Microsoft YaHei",sans-serif;
  background:#0E0E13 radial-gradient(1200px 800px at 20% -10%,#1C1B2B 0%,#0E0E13 60%);
  color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:28px 12px 40px;
}
.page-tip{color:#8B8B96;font-size:13px;margin:18px 0 0;letter-spacing:.04em;text-align:center;line-height:1.8}
.page-tip b{color:#C9C9D4;font-weight:600}
.page-tip a{color:#9FB4FF}

/* ============ 手机壳 ============ */
.phone{
  width:390px;height:min(844px,calc(100vh - 110px));min-height:640px;position:relative;flex:none;
  border-radius:52px;background:#000;padding:11px;
  box-shadow:0 0 0 2px #2A2A31,0 40px 90px rgba(0,0,0,.65),0 0 120px rgba(122,92,255,.14);
}
.screen-wrap{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#000;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:48px;z-index:55;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0;font-size:14.5px;font-weight:600;pointer-events:none}
.statusbar .sicons{display:flex;gap:6px;align-items:center;color:inherit}

/* ============ 屏幕通用 ============ */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:block;padding:60px 18px 118px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
a{color:inherit;text-decoration:none}

/* ============ 演示导航 ============ */
.demo-nav{position:fixed;right:14px;bottom:14px;z-index:99;background:rgba(20,20,26,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 12px;color:#C9C9D4;font-size:11px;line-height:1.5;max-width:170px}
.demo-nav b{display:block;font-size:11.5px;margin-bottom:6px;color:#fff}
.demo-nav a{display:inline-block;color:#9FB4FF;text-decoration:none;margin:2px 8px 2px 0;cursor:pointer}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:760px){.demo-nav{display:none}}

/* ============ Album Manage（批量管理） ============ */
.mng-top{display:flex;align-items:center;margin-bottom:14px}
.mng-top .m-cancel{font-size:14px;color:var(--ink2);cursor:pointer}
.mng-top .m-count{position:absolute;left:50%;transform:translateX(-50%);font-size:15.5px;font-weight:700}
.mng-top .m-all{margin-left:auto;font-size:14px;font-weight:600;color:var(--ai2);cursor:pointer}
.ai-hint{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ai1);background:rgba(122,92,255,.08);border:1px solid rgba(122,92,255,.16);border-radius:12px;padding:9px 13px;margin-bottom:14px}
.ai-hint svg{width:14px;height:14px;flex:none}
.group-l{font-size:12px;font-weight:600;color:var(--ink3);margin:16px 2px 9px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo{aspect-ratio:1;border-radius:12px;position:relative;overflow:hidden;cursor:pointer}
.photo::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2.5px solid transparent;transition:border-color .15s;pointer-events:none}
.photo .chk{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85);border:1.5px solid #D7D5CD;z-index:2}
.photo.on::after{border-color:var(--ai1)}
.photo.on .chk{background:var(--grad-ai);border-color:transparent;display:flex;align-items:center;justify-content:center}
.photo.on .chk svg{width:12px;height:12px}
.photo.dim{opacity:.55}
.actionbar{position:absolute;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:14px 16px 26px}
.actionbar .ab-note{text-align:center;font-size:11px;color:var(--ink3);margin-bottom:10px}
.actionbar .ab-row{display:flex;gap:10px}
.ab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:650;border-radius:99px;padding:12px 6px;cursor:pointer;background:#F3F2ED;color:var(--ink);white-space:nowrap}
.ab-btn svg{width:15px;height:15px}
.ab-btn.danger{background:rgba(240,106,106,.12);color:#E05252}
.ab-note-line{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:9px;font-size:11px;color:var(--ink3)}
.ab-note-line svg{width:11px;height:11px;color:var(--health)}

/* 照片占位（原型用柔和渐变代替真实照片） */
.g1{background:linear-gradient(150deg,#FFD9C2,#FF9D76)}
.g2{background:linear-gradient(150deg,#B9CCFF,#6E93FF)}
.g3{background:linear-gradient(150deg,#9FE8CF,#33BC8C)}
.g4{background:linear-gradient(150deg,#C3B3FF,#7A5CFF)}
.g5{background:linear-gradient(150deg,#FFE3A8,#EFA63C)}
.g6{background:linear-gradient(150deg,#A8E6F0,#1FA8BC)}
.g7{background:linear-gradient(150deg,#F3C6D3,#E08CA8)}
.g8{background:linear-gradient(150deg,#D8D3E8,#8F89B0)}
</style>
</head>
<body>
