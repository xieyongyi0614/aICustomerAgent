<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>朝夕 · 33 手动记账 — 高保真原型</title>
<style>
/* ============ 基础与主题 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F4F0;            /* 暖纸白：长期陪伴的背景 */
  --card:#FFFFFF;
  --ink:#1B1C23;           /* 主文字 */
  --ink2:#6E7079;          /* 次文字 */
  --ink3:#A7A8B1;          /* 弱文字 */
  --line:#ECEAE3;
  --ai1:#7A5CFF;           /* AI 紫 */
  --ai2:#3E8BFF;           /* AI 蓝 */
  --ai3:#2BD2E8;           /* AI 青 */
  --warm:#FF9D76;          /* 温暖点缀 */
  --health:#33BC8C;
  --money:#EFA63C;
  --grad-ai:linear-gradient(135deg,#8B6DFF 0%,#4D8DFF 55%,#2BD2E8 100%);
  --shadow-card:0 10px 30px rgba(27,28,35,.06);
  --r-lg:24px;--r-md:18px;--r-sm:12px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonicOS Sans SC","Microsoft YaHei",sans-serif;
  background:#0E0E13 radial-gradient(1200px 800px at 20% -10%,#1C1B2B 0%,#0E0E13 60%);
  color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:28px 12px 40px;
}
.page-tip{color:#8B8B96;font-size:13px;margin:18px 0 0;letter-spacing:.04em;text-align:center;line-height:1.8}
.page-tip b{color:#C9C9D4;font-weight:600}
.page-tip a{color:#9FB4FF}

/* ============ 手机壳 ============ */
.phone{
  width:390px;height:min(844px,calc(100vh - 110px));min-height:640px;position:relative;flex:none;
  border-radius:52px;background:#000;padding:11px;
  box-shadow:0 0 0 2px #2A2A31,0 40px 90px rgba(0,0,0,.65),0 0 120px rgba(122,92,255,.14);
}
.screen-wrap{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#000;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:48px;z-index:55;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0;font-size:14.5px;font-weight:600;pointer-events:none}
.statusbar .sicons{display:flex;gap:6px;align-items:center;color:inherit}

/* ============ 屏幕通用 ============ */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:block;padding:60px 18px 40px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
a{color:inherit;text-decoration:none}
.back{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:14px;cursor:pointer;margin-bottom:14px;user-select:none;width:fit-content}
.back svg{width:18px;height:18px}

/* ============ 演示导航 ============ */
.demo-nav{position:fixed;right:14px;bottom:14px;z-index:99;background:rgba(20,20,26,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 12px;color:#C9C9D4;font-size:11px;line-height:1.5;max-width:170px}
.demo-nav b{display:block;font-size:11.5px;margin-bottom:6px;color:#fff}
.demo-nav a{display:inline-block;color:#9FB4FF;text-decoration:none;margin:2px 8px 2px 0;cursor:pointer}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:760px){.demo-nav{display:none}}

/* ============ Ledger Add（手动记账） ============ */
.seg{display:flex;background:#EDECE5;border-radius:99px;padding:4px;margin-bottom:14px}
.seg span{flex:1;text-align:center;padding:8px 0;border-radius:99px;font-size:13.5px;font-weight:650;color:var(--ink2);cursor:pointer}
.seg span.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(27,28,35,.08)}
.amount{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:22px 18px;text-align:right;font-variant-numeric:tabular-nums}
.amount .a-l{text-align:left;font-size:12px;color:var(--ink3);margin-bottom:4px}
.amount .a-v{font-size:38px;font-weight:750;letter-spacing:-.02em}
.amount .a-v .cur{font-size:22px;font-weight:700;margin-right:4px}
.amount .a-v .caret{display:inline-block;width:2px;height:30px;background:var(--money);margin-left:3px;vertical-align:-4px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kind-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
.kind{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:11px 4px 9px;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:transform .15s}
.kind:active{transform:scale(.95)}
.kind .k-ic{width:34px;height:34px;border-radius:11px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.kind .k-ic svg{width:16px;height:16px}
.kind .k-n{font-size:11.5px;font-weight:600;color:var(--ink2)}
.kind.on{border-color:rgba(239,166,60,.55)}
.kind.on .k-n{color:var(--ink)}
.form{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:4px 18px;margin-top:14px}
.f-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.f-row:last-child{border-bottom:none}
.f-row .f-l{font-size:13px;color:var(--ink2);width:44px;flex:none}
.f-row .f-v{font-size:14px;font-weight:600}
.f-row .f-v.ph{color:var(--ink3);font-weight:400}
.f-row .f-go{margin-left:auto;color:var(--ink3);display:flex}
.f-row .f-go svg{width:15px;height:15px}
.ai-hint{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ai1);background:rgba(122,92,255,.08);border:1px solid rgba(122,92,255,.16);border-radius:12px;padding:9px 13px;margin-top:14px}
.ai-hint svg{width:14px;height:14px;flex:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.key{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow-card);height:54px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:650;cursor:pointer;transition:transform .15s;font-variant-numeric:tabular-nums}
.key:active{transform:scale(.95)}
.key svg{width:22px;height:22px}
.save{display:block;text-align:center;background:var(--ink);color:#fff;font-size:15px;font-weight:700;border-radius:99px;padding:15px;margin-top:16px;box-shadow:0 12px 26px rgba(27,28,35,.22);cursor:pointer}
</style>
</head>
