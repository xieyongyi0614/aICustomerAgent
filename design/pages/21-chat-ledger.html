<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝夕 · 21 对话 · AI 记账 — 高保真原型</title>
<style>
/* ============ 基础与主题 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F4F0;            /* 暖纸白：长期陪伴的背景 */
  --card:#FFFFFF;
  --ink:#1B1C23;           /* 主文字 */
  --ink2:#6E7079;          /* 次文字 */
  --ink3:#A7A8B1;          /* 弱文字 */
  --line:#ECEAE3;
  --ai1:#7A5CFF;           /* AI 紫 */
  --ai2:#3E8BFF;           /* AI 蓝 */
  --ai3:#2BD2E8;           /* AI 青 */
  --warm:#FF9D76;          /* 温暖点缀 */
  --health:#33BC8C;
  --money:#EFA63C;
  --grad-ai:linear-gradient(135deg,#8B6DFF 0%,#4D8DFF 55%,#2BD2E8 100%);
  --shadow-card:0 10px 30px rgba(27,28,35,.06);
  --r-lg:24px;--r-md:18px;--r-sm:12px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonicOS Sans SC","Microsoft YaHei",sans-serif;
  background:#0E0E13 radial-gradient(1200px 800px at 20% -10%,#1C1B2B 0%,#0E0E13 60%);
  color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:28px 12px 40px;
}
.page-tip{color:#8B8B96;font-size:13px;margin:18px 0 0;letter-spacing:.04em;text-align:center;line-height:1.8}
.page-tip b{color:#C9C9D4;font-weight:600}
.page-tip a{color:#9FB4FF}

/* ============ 手机壳 ============ */
.phone{
  width:390px;height:min(844px,calc(100vh - 110px));min-height:640px;position:relative;flex:none;
  border-radius:52px;background:#000;padding:11px;
  box-shadow:0 0 0 2px #2A2A31,0 40px 90px rgba(0,0,0,.65),0 0 120px rgba(122,92,255,.14);
}
.screen-wrap{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#000;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:48px;z-index:55;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0;font-size:14.5px;font-weight:600;pointer-events:none}
.statusbar .sicons{display:flex;gap:6px;align-items:center;color:inherit}

/* ============ 屏幕通用 ============ */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:block;padding:60px 18px 118px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
a{color:inherit;text-decoration:none}
.row{display:flex;align-items:center}
.grow{flex:1}
h1.pt{font-size:24px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--ink2)}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:18px}
.card,.b-start{display:block}
.back{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:14px;cursor:pointer;margin-bottom:14px;user-select:none;width:fit-content}
.back svg{width:18px;height:18px}

/* ============ AI 核心球 ============ */
.orb{position:relative;flex:none;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#D9CCFF 0%,#8B6DFF 34%,#4D6BFF 66%,#1FB9D8 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 10px 30px rgba(102,90,255,.45),0 0 60px rgba(63,150,255,.35);
  animation:breathe 4.2s ease-in-out infinite;
}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 68% 72%,rgba(43,210,232,.85),transparent 46%),radial-gradient(circle at 30% 26%,rgba(255,255,255,.9),transparent 30%);
  mix-blend-mode:screen;animation:swirl 7s linear infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
@keyframes swirl{to{transform:rotate(360deg)}}
.orb.lg{width:76px;height:76px}.orb.md{width:34px;height:34px}.orb.sm{width:22px;height:22px}

/* ============ 演示导航 ============ */
.demo-nav{position:fixed;right:14px;bottom:14px;z-index:99;background:rgba(20,20,26,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 12px;color:#C9C9D4;font-size:11px;line-height:1.5;max-width:170px}
.demo-nav b{display:block;font-size:11.5px;margin-bottom:6px;color:#fff}
.demo-nav a{display:inline-block;color:#9FB4FF;text-decoration:none;margin:2px 8px 2px 0;cursor:pointer}
.demo-nav a:hover{text-decoration:underline}
@media (max-width:760px){.demo-nav{display:none}}

/* ============ Chat ============ */
.chat-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.chat-head .nm{font-size:16.5px;font-weight:700}
.chat-head .st{font-size:11.5px;color:var(--health);display:flex;align-items:center;gap:4px}
.chat-head .st i{width:6px;height:6px;border-radius:50%;background:var(--health);display:inline-block}
.mem-hint{display:flex;align-items:center;gap:8px;background:rgba(122,92,255,.08);border:1px solid rgba(122,92,255,.16);color:var(--ai1);font-size:12px;font-weight:600;border-radius:12px;padding:9px 13px;margin-bottom:18px}
.mem-hint svg{width:14px;height:14px;flex:none}
.msg{display:flex;margin-bottom:14px;max-width:100%}
.msg .bubble{padding:12px 15px;border-radius:20px;font-size:14.5px;line-height:1.65;max-width:78%}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:#1F222B;color:#F4F4F7;border-bottom-right-radius:6px}
.msg.ai{gap:9px}
.msg.ai .bubble{background:var(--card);box-shadow:var(--shadow-card);border-bottom-left-radius:6px;color:#2C2D35}
.msg.ai .orb{margin-top:3px}
.proc{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:15px 16px;margin:0 0 14px 31px;max-width:86%}
.proc .p-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:4px}
.proc .p-head .spin{margin-left:auto}
.pstep{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.pstep:last-child{border-bottom:none}
.pstep .ic{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.pstep.done .ic{background:rgba(51,188,140,.14);color:var(--health)}
.pstep.run .ic{border:2px solid rgba(122,92,255,.25);border-top-color:var(--ai1);animation:rot .9s linear infinite}
.pstep.todo .ic{border:1.6px solid #DDDCD4}
.pstep .s-t{font-weight:600}
.pstep .s-d{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right}
@keyframes rot{to{transform:rotate(360deg)}}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(122,92,255,.25);border-top-color:var(--ai1);animation:rot .9s linear infinite}
.chip-row{display:flex;gap:8px;margin:0 0 16px 31px;flex-wrap:wrap}
.chip-btn{font-size:12.5px;font-weight:600;color:var(--ai1);background:rgba(122,92,255,.09);border:1px solid rgba(122,92,255,.2);border-radius:99px;padding:7px 14px;cursor:pointer}
.chip-btn.ghost{color:var(--ink2);background:var(--card);border-color:var(--line)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#C9C8F5;animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.inputbar{position:absolute;left:0;right:0;bottom:0;z-index:52;padding:12px 16px 26px;background:linear-gradient(180deg,rgba(245,244,240,0),var(--bg) 34%)}
.inputbar .ib-in{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:99px;box-shadow:var(--shadow-card);padding:7px 7px 7px 16px}
.inputbar .ib-in .ph{flex:1;font-size:14px;color:var(--ink3)}
.ib-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.ib-ic.go{background:var(--grad-ai);color:#fff}
.ib-ic svg{width:17px;height:17px}
</style>
</head>
